<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#efe6da" />
    <meta
      name="description"
      content="SmilePec accompagne les cabinets dentaires dans la gestion et l’optimisation du tiers payant : gestion complète, optimisation des estimations, reprise des impayés."
    />
    <meta property="og:site_name" content="SmilePec" />
    <meta property="og:title" content="SmilePec — Gestion et optimisation du tiers payant dentaire" />
    <meta
      property="og:description"
      content="Et si la simple saisie d'un devis … suffisait à révéler les meilleures garanties de vos patients ?"
    />
    <meta property="og:image" content="/brand/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/brand/smilepec-emblem.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/brand/smilepec-wordmark.svg" type="image/svg+xml" />
    <title>SmilePec — Gestion et optimisation du tiers payant dentaire</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 82% 10%, rgba(201, 173, 127, 0.22), transparent 55%),
          radial-gradient(ellipse at 12% 90%, rgba(255, 255, 255, 0.7), transparent 55%),
          #efe6da;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        width: min(300px, 72vw);
      }
      .boot-splash-emblem {
        width: 34%;
        height: auto;
        clip-path: inset(0 100% 0 0);
        animation: boot-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
      }
      .boot-splash-wordmark {
        width: 100%;
        height: auto;
        opacity: 0;
        transform: translateY(8px);
        animation: boot-rise 0.7s ease-out 0.45s forwards;
      }
      .boot-splash-line {
        width: 46%;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #837154, transparent);
        background-size: 200% 100%;
        opacity: 0;
        animation:
          boot-fade 0.4s ease 0.9s forwards,
          boot-shine 1.4s ease-in-out 0.9s infinite;
      }
      @keyframes boot-draw {
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes boot-rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-fade {
        to {
          opacity: 0.85;
        }
      }
      @keyframes boot-shine {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-emblem,
        .boot-splash-wordmark,
        .boot-splash-line {
          animation: none;
          clip-path: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Chargement de SmilePec">
      <div class="boot-splash-inner">
        <img class="boot-splash-emblem" src="/brand/smilepec-emblem.svg" alt="" width="116" height="56" />
        <img class="boot-splash-wordmark" src="/brand/smilepec-wordmark.svg" alt="SmilePec" width="356" height="87" />
        <span class="boot-splash-line"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
